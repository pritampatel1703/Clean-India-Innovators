<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Clean India Innovators</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" type="image/png" href="LOGO/logo circle.png">
</head>

<body class="auth-page">

    <div style="position: absolute; top: 20px; right: 20px;">
        <select id="lang-selector"
            style="padding: 5px; border-radius: 5px; border: 1px solid #ccc; outline: none; font-family: inherit;">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="gu">Gujarati</option>
        </select>
    </div>

    <a href="index.html" class="back-home" data-i18n="auth_back_home"><i class="fa-solid fa-arrow-left"></i> Back to
        Home</a>



    <div class="auth-container">
        <div class="auth-logo">
            <img src="LOGO/logo circle.png" alt="Logo">
        </div>
        <div class="auth-header">
            <h2 data-i18n="auth_login_title">Welcome Back</h2>
            <p data-i18n="auth_login_desc">Login to continue your Clean India journey</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label data-i18n="label_email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required data-i18n="placeholder_email">
            </div>
            <div class="form-group">
                <label data-i18n="label_password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required
                    data-i18n="placeholder_password">
                <div style="text-align: right; margin-top: 5px;">
                    <a href="forgot-password.html" style="font-size: 0.85rem; color: #64748b;"
                        data-i18n="auth_forgot_pass">Forgot Password?</a>
                </div>
            </div>
            <button type="submit" class="btn-auth" data-i18n="btn_login">Login</button>
        </form>

        <div class="auth-footer">
            <span data-i18n="auth_no_account">Don't have an account?</span> <a href="signup.html"
                data-i18n="btn_signup">Sign Up</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/lang.js"></script>
</body>

</html>
