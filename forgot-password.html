<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Clean India Innovators</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" type="image/png" href="LOGO/logo circle.png">
</head>

<body class="auth-page">

    <div style="position: absolute; top: 20px; right: 20px;">
        <select id="lang-selector"
            style="padding: 5px; border-radius: 5px; border: 1px solid #ccc; outline: none; font-family: inherit;">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="gu">Gujarati</option>
        </select>
    </div>

    <div class="auth-container">
        <div class="auth-logo">
            <img src="LOGO/logo circle.png" alt="Logo">
        </div>
        <div class="auth-header">
            <h2 data-i18n="auth_reset_title">Reset Password</h2>
            <p data-i18n="auth_reset_desc">Enter your email to find your account</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message"
            style="display: none; background: #f0fdf4; color: #16a34a; padding: 10px; border-radius: 8px; margin-bottom: 20px;">
        </div>

        <form class="auth-form" onsubmit="handleForgotPassword(event)">
            <!-- Step 1: Email -->
            <div id="step-email">
                <div class="form-group">
                    <label data-i18n="label_email">Email Address</label>
                    <input type="email" id="reset-email" placeholder="Enter your registered email" required
                        data-i18n="placeholder_email">
                </div>
                <button type="button" class="btn-auth" onclick="verifyEmailForReset()" data-i18n="btn_find_account">Find
                    Account</button>
            </div>

            <!-- Step 2: New Password (Hidden initially) -->
            <div id="step-password" class="hidden">
                <div class="form-group">
                    <label data-i18n="label_new_pass">New Password</label>
                    <input type="password" id="new-password" placeholder="Enter new password"
                        data-i18n="placeholder_password">
                </div>
                <div class="form-group">
                    <label data-i18n="label_confirm_pass">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm new password"
                        data-i18n="placeholder_password">
                </div>
                <button type="submit" class="btn-auth" data-i18n="btn_update_pass">Update Password</button>
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/lang.js"></script>
</body>

</html>
